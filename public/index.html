<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vessel Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">

<style>
/* ─── Reset ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ─── Theme tokens ──────────────────────────────────────────── */
:root {
  --bg:            #0f172a;
  --panel:         #1e293b;
  --panel-border:  #334155;
  --text:          #e2e8f0;
  --text-muted:    #94a3b8;
  --accent:        #06b6d4;
  --accent-hover:  #0891b2;
  --danger:        #ef4444;
  --success:       #22c55e;
  --warning:       #f59e0b;
  --border:        rgba(255,255,255,0.08);
  --shadow:        0 4px 24px rgba(0,0,0,0.5);
}

[data-theme="light"] {
  --bg:           #f8fafc;
  --panel:        #ffffff;
  --panel-border: #e2e8f0;
  --text:         #1e293b;
  --text-muted:   #64748b;
  --border:       rgba(0,0,0,0.08);
  --shadow:       0 4px 24px rgba(0,0,0,0.12);
}

/* ─── Layout ────────────────────────────────────────────────── */
html, body {
  height: 100%;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

body { display: flex; flex-direction: column; }

/* ─── Header ────────────────────────────────────────────────── */
#header {
  height: 48px;
  background: var(--panel);
  border-bottom: 1px solid var(--panel-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  flex-shrink: 0;
  position: relative;
  z-index: 100;
}

.app-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: -0.01em;
}

.header-right { display: flex; align-items: center; gap: 8px; }

.icon-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text);
  width: 32px;
  height: 32px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  transition: background 0.15s, border-color 0.15s;
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--border); border-color: var(--accent); }
.icon-btn.active { border-color: var(--accent); color: var(--accent); }

/* ─── Status dot ─────────────────────────────────────────────── */
.status-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
  transition: background 0.3s;
}
.status-dot.connected    { background: var(--success); }
.status-dot.reconnecting { background: var(--warning); animation: blink 1s infinite; }
.status-dot.disconnected { background: var(--danger); }

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ─── Map ────────────────────────────────────────────────────── */
#map { flex: 1; min-height: 0; }

/* Layer switcher — keep it above the draw toolbar */
.leaflet-control-layers {
  border-radius: 6px !important;
  margin-right: 0 !important;
  margin-bottom: 32px !important;
  font-family: 'Inter', sans-serif !important;
  font-size: 12px !important;
}
.leaflet-control-layers-list { padding: 4px 0 !important; }
.leaflet-control-layers-selector { margin-right: 5px; }

/* ─── Status bar ─────────────────────────────────────────────── */
#status-bar {
  background: rgba(15, 23, 42, 0.94);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--panel-border);
  padding: 6px 16px 8px;
  flex-shrink: 0;
  z-index: 100;
}

[data-theme="light"] #status-bar { background: rgba(248,250,252,0.95); }

.status-meta {
  display: flex;
  gap: 16px;
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 4px;
}

#alert-log {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 66px;
  overflow-y: auto;
}

.alert-entry {
  font-size: 11px;
  color: var(--warning);
  line-height: 1.5;
}
.alert-entry time { color: var(--text-muted); margin-right: 6px; }

@keyframes status-flash {
  0%,100% { background: transparent; }
  40%      { background: rgba(245,158,11,0.18); }
}
#status-bar.flash { animation: status-flash 0.55s ease 3; }

/* ─── Settings overlay + panel ───────────────────────────────── */
#settings-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 999;
}
#settings-overlay.open { display: block; }

#settings-panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 320px;
  background: var(--panel);
  border-left: 1px solid var(--panel-border);
  box-shadow: var(--shadow);
  z-index: 1000;
  transform: translateX(100%);
  transition: transform 0.25s ease;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
#settings-panel.open { transform: translateX(0); }

.settings-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 16px;
  border-bottom: 1px solid var(--panel-border);
  flex-shrink: 0;
  position: sticky;
  top: 0;
  background: var(--panel);
  z-index: 1;
}
.settings-header h2 { font-size: 14px; font-weight: 600; }

.settings-section {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}
.settings-section h3 {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--text-muted);
  margin-bottom: 12px;
}

/* ─── Form controls ──────────────────────────────────────────── */
.form-group { margin-bottom: 10px; }
.form-group:last-child { margin-bottom: 0; }
.form-group label {
  display: block;
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 4px;
}

input[type="text"],
input[type="password"],
input[type="number"],
select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  color: var(--text);
  padding: 7px 10px;
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s;
}
input:focus, select:focus { border-color: var(--accent); }

.input-row { display: flex; gap: 6px; margin-bottom: 8px; }
.input-row input { flex: 1; }

.inline-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.inline-row label { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.inline-row select { width: auto; flex: 1; }

.btn-primary {
  background: var(--accent);
  border: none;
  color: #fff;
  padding: 7px 13px;
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
}
.btn-primary:hover { background: var(--accent-hover); }

.btn-danger {
  background: transparent;
  border: 1px solid var(--danger);
  color: var(--danger);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-danger:hover { background: rgba(239,68,68,0.1); }

/* ─── MMSI list ──────────────────────────────────────────────── */
#mmsi-list { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }

.mmsi-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
}
.mmsi-item-info { display: flex; flex-direction: column; gap: 1px; }
.mmsi-name  { font-size: 12px; font-weight: 500; }
.mmsi-num   { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.mmsi-empty { font-size: 12px; color: var(--text-muted); text-align: center; padding: 8px 0; }

.mmsi-remove {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  padding: 2px 4px;
  border-radius: 4px;
  transition: color 0.15s;
}
.mmsi-remove:hover { color: var(--danger); }

/* ─── Geofence status ────────────────────────────────────────── */
.zone-status {
  font-size: 13px;
  padding: 7px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 10px;
}
.zone-status.active { border-color: var(--accent); color: var(--accent); }

/* ─── Vessel tooltip label ───────────────────────────────────── */
.vessel-label {
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  padding: 0 !important;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.6);
  white-space: nowrap;
  pointer-events: none;
}
[data-theme="light"] .vessel-label {
  color: #1e293b;
  text-shadow: 0 1px 3px rgba(255,255,255,0.95), 0 0 6px rgba(255,255,255,0.7);
}
.vessel-label::before { display: none !important; }

/* ─── Map scale ruler ────────────────────────────────────────── */
.leaflet-control-scale-line {
  background: transparent !important;
  border-color: #000 !important;
  color: #000 !important;
  text-shadow: none !important;
  font-size: 11px;
  margin-bottom: 0 !important;
}

.leaflet-control-attribution { display: none !important; }

/* ─── Responsive ─────────────────────────────────────────────── */
@media (max-width: 767px) {
  #settings-panel { width: 100%; }
}
</style>
</head>

<body>

<!-- Prevent theme flash before DOMContentLoaded -->
<script>
(function(){
  var t = localStorage.getItem('ais_theme');
  var html = document.documentElement;
  if (t === 'light' || t === 'dark') { html.setAttribute('data-theme', t); }
  else { html.setAttribute('data-theme', window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); }
})();
</script>

<!-- ─── Header ────────────────────────────────────────────────── -->
<header id="header">
  <span class="app-title">Vessel Tracker</span>
  <div class="header-right">
    <div id="status-dot" class="status-dot disconnected" title="Connection status"></div>
    <button id="track-toggle" class="icon-btn" title="Toggle tracked / all vessels">◎</button>
    <button id="theme-btn"    class="icon-btn" title="Toggle theme">☀</button>
    <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
  </div>
</header>

<!-- ─── Settings ─────────────────────────────────────────────── -->
<div id="settings-overlay"></div>
<aside id="settings-panel">
  <div class="settings-header">
    <h2>Settings</h2>
    <button id="settings-close" class="icon-btn" style="font-size:18px;">×</button>
  </div>

  <div class="settings-section">
    <h3>AISStream API Key</h3>
    <input type="password" id="api-key-input" placeholder="Paste your API key…" autocomplete="off">
  </div>

  <div class="settings-section">
    <h3>Tracked Vessels</h3>
    <div class="input-row">
      <input type="text" id="mmsi-input" placeholder="9-digit MMSI…" maxlength="9" inputmode="numeric">
      <button id="mmsi-add-btn" class="btn-primary">Add</button>
    </div>
    <div class="inline-row">
      <label>Max vessels:</label>
      <select id="max-vessels-select">
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5" selected>5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
      </select>
    </div>
    <div id="mmsi-list"></div>
  </div>

  <div class="settings-section">
    <h3>Alert Settings</h3>
    <div class="form-group">
      <label>Speed Threshold (kts)</label>
      <input type="number" id="speed-threshold" value="2.0" min="0" max="50" step="0.1">
    </div>
    <div class="form-group">
      <label>Alert Cooldown (min)</label>
      <input type="number" id="alert-cooldown" value="30" min="1" max="1440">
    </div>
  </div>

  <div class="settings-section">
    <h3>Geofence</h3>
    <div id="zone-status" class="zone-status">No zone drawn</div>
    <button id="clear-zone-btn" class="btn-danger">Clear Zone</button>
  </div>
</aside>

<!-- ─── Map ───────────────────────────────────────────────────── -->
<div id="map"></div>

<!-- ─── Status bar ───────────────────────────────────────────── -->
<footer id="status-bar">
  <div class="status-meta">
    <span id="status-text">Connecting…</span>
    <span id="vessel-count">0 vessels tracked</span>
  </div>
  <div id="alert-log"></div>
</footer>

<!-- ─── CDN Scripts ───────────────────────────────────────────── -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<script>
'use strict';

// ─── Constants ────────────────────────────────────────────────────────────────
const DEFAULT_CENTER  = [32.7157, -117.1611];
const DEFAULT_ZOOM    = 12;
const DEFAULT_BBOX    = [[32.5, -117.5], [32.9, -116.9]];
const STALE_MS        = 10 * 60 * 1000; // 10 minutes

const NAV_STATUS = {
  0:'Under way (engine)', 1:'At anchor', 2:'Not under command',
  3:'Restricted maneuverability', 4:'Constrained by draught',
  5:'Moored', 6:'Aground', 7:'Engaged in fishing',
  8:'Under way (sailing)', 9:'Reserved (HSC)', 10:'Reserved (WIG)',
  11:'Reserved', 12:'Reserved', 13:'Reserved', 14:'AIS-SART', 15:'Not defined',
};

const LS = {
  apiKey:         'ais_apiKey',
  mmsiList:       'ais_mmsiList',
  maxVessels:     'ais_maxVessels',
  speedThreshold: 'ais_speedThreshold',
  alertCooldown:  'ais_alertCooldown',
  geofence:       'ais_geofence',
  theme:          'ais_theme',
  trackOnly:      'ais_trackOnly',
  mapStyle:       'ais_mapStyle',
};

// ─── App state ────────────────────────────────────────────────────────────────
let map, drawnItems;
let ws = null;
let wsTimer = null;
let geofenceLayer   = null;
let geofenceGeoJSON = null;

const vessels      = new Map(); // mmsi → { marker, name, sog, cog, heading, navStatus, time, lat, lon, lastUpdate, stale }
const alertTimes   = new Map(); // mmsi → timestamp of last alert
const alertLog     = [];        // [{time, text}] up to 5

// ─── Settings ─────────────────────────────────────────────────────────────────
function loadSettings() {
  return {
    apiKey:         localStorage.getItem(LS.apiKey)         || '',
    mmsiList:       JSON.parse(localStorage.getItem(LS.mmsiList) || '[]'),
    maxVessels:     parseInt(localStorage.getItem(LS.maxVessels)     || '5'),
    speedThreshold: parseFloat(localStorage.getItem(LS.speedThreshold) || '2.0'),
    alertCooldown:  parseInt(localStorage.getItem(LS.alertCooldown)  || '30'),
    trackOnly:      localStorage.getItem(LS.trackOnly) === 'true',
  };
}

let cfg = loadSettings();

function saveSettings() {
  localStorage.setItem(LS.apiKey,         cfg.apiKey);
  localStorage.setItem(LS.mmsiList,       JSON.stringify(cfg.mmsiList));
  localStorage.setItem(LS.maxVessels,     String(cfg.maxVessels));
  localStorage.setItem(LS.speedThreshold, String(cfg.speedThreshold));
  localStorage.setItem(LS.alertCooldown,  String(cfg.alertCooldown));
  localStorage.setItem(LS.trackOnly,      String(cfg.trackOnly));
}

// ─── Theme ────────────────────────────────────────────────────────────────────
function currentTheme() { return document.documentElement.getAttribute('data-theme'); }

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem(LS.theme, t);
  document.getElementById('theme-btn').textContent = t === 'dark' ? '☀' : '☾';
  // Auto-switch map style to match theme (respects manual override if saved)
  if (map) {
    const saved = localStorage.getItem(LS.mapStyle);
    if (!saved) {
      const layerId = t === 'light' ? 'Light' : 'Dark';
      if (TILE_LAYERS[layerId]) {
        map.removeLayer(Object.values(TILE_LAYERS).find(l => map.hasLayer(l)));
        TILE_LAYERS[layerId].addTo(map);
      }
    }
  }
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtTime(timeStr) {
  try {
    // AISStream format: "2024-01-25 01:25:13.750579416 +0000 UTC"
    // Extract just "YYYY-MM-DD HH:MM:SS" which Date can parse as UTC
    const m = String(timeStr).match(/(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2}:\d{2})/);
    if (!m) return timeStr;
    const d = new Date(m[1] + 'T' + m[2] + 'Z');
    if (isNaN(d)) return timeStr;
    const date = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).replace(' AM', 'AM').replace(' PM', 'PM');
    return `${date}, ${time}`;
  } catch { return timeStr; }
}

// ─── Vessel icons ─────────────────────────────────────────────────────────────
function effectiveRotation(heading, cog) {
  if (heading !== undefined && heading !== null && heading !== 511) return heading;
  if (cog     !== undefined && cog     !== null && cog     !== 360) return cog;
  return null;
}

function makeIcon(sog, cog, heading, stale, tracked) {
  const rotation = effectiveRotation(heading, cog);
  let color;
  if (stale) {
    color = '#64748b';
  } else if (tracked) {
    const slow = sog <= cfg.speedThreshold;
    color = slow ? '#ef4444' : '#22c55e';
  } else {
    color = '#3b82f6'; // blue for non-tracked vessels
  }

  const sz = tracked ? { w: 24, h: 36 } : { w: 16, h: 24 };
  const circR = tracked ? 6 : 5;

  if (sog === 0 || rotation === null) {
    // Stationary or no heading data → circle
    const d = circR * 2;
    return L.divIcon({
      className: '',
      html: `<div style="width:${d}px;height:${d}px;border-radius:50%;background:${color};border:2px solid rgba(255,255,255,0.85);box-shadow:0 1px 4px rgba(0,0,0,0.6);"></div>`,
      iconSize:   [d, d],
      iconAnchor: [circR, circR],
    });
  }

  // Arrow pointing north by default, rotated to COG/heading
  const svg = `<svg viewBox="0 0 20 30" xmlns="http://www.w3.org/2000/svg" width="${sz.w}" height="${sz.h}">
    <path d="M10 2 L18 27 L10 21 L2 27 Z" fill="${color}" stroke="rgba(255,255,255,0.85)" stroke-width="1.5" stroke-linejoin="round"/>
  </svg>`;

  return L.divIcon({
    className: '',
    html: `<div style="width:${sz.w}px;height:${sz.h}px;transform:rotate(${rotation}deg);transform-origin:${sz.w/2}px ${sz.h/2}px;">${svg}</div>`,
    iconSize:   [sz.w, sz.h],
    iconAnchor: [sz.w/2, sz.h/2],
  });
}

// ─── Popup content ────────────────────────────────────────────────────────────
function popupHTML(v) {
  const nav     = NAV_STATUS[v.navStatus] ?? `Status ${v.navStatus}`;
  const hdg     = (v.heading !== undefined && v.heading !== 511) ? `${v.heading}°` : 'N/A';
  const updated = v.time ? fmtTime(v.time) : 'N/A';
  return `
    <div style="font-family:'Inter',sans-serif;">
      <div style="font-size:14px;font-weight:600;color:#06b6d4;margin-bottom:8px;">${esc(v.name)}</div>
      <table style="width:100%;border-collapse:collapse;font-size:12px;line-height:1.6;">
        <tr><td style="color:#94a3b8;padding-right:8px;width:90px;">MMSI</td><td>${esc(v.mmsi)}</td></tr>
        <tr><td style="color:#94a3b8;">Speed</td><td>${v.sog !== undefined ? v.sog.toFixed(1)+' kts' : 'N/A'}</td></tr>
        <tr><td style="color:#94a3b8;">Course</td><td>${v.cog !== undefined ? v.cog+'°' : 'N/A'}</td></tr>
        <tr><td style="color:#94a3b8;">Heading</td><td>${hdg}</td></tr>
        <tr><td style="color:#94a3b8;">Nav Status</td><td>${esc(nav)}</td></tr>
        <tr><td style="color:#94a3b8;">Last Update</td><td>${esc(updated)}</td></tr>
      </table>
    </div>`;
}

// ─── Vessel management ────────────────────────────────────────────────────────
function upsertVessel(data) {
  const { mmsi, name, lat, lon, sog, cog, heading, navStatus, time, classB } = data;
  const isTracked = cfg.mmsiList.includes(mmsi);

  if (vessels.has(mmsi)) {
    const v = vessels.get(mmsi);
    const nameChanged = name && name !== mmsi && name !== v.name;
    v.name      = name || v.name;
    if (sog !== undefined) v.sog = sog;
    if (cog !== undefined) v.cog = cog;
    if (heading !== undefined) v.heading = heading;
    if (navStatus !== undefined) v.navStatus = navStatus;
    v.time      = time || v.time;
    if (lat !== undefined) v.lat = lat;
    if (lon !== undefined) v.lon = lon;
    v.lastUpdate = Date.now();
    v.stale     = false;
    v.classB    = classB || v.classB;

    v.marker.setLatLng([v.lat, v.lon]);
    v.marker.setIcon(makeIcon(v.sog, v.cog, v.heading, false, isTracked));
    v.marker.setPopupContent(popupHTML(v));
    v.marker.getTooltip().setContent(v.name);

    if (nameChanged) renderMMSIList(); // refresh name in settings
  } else {
    const v = { mmsi, name: name || mmsi, sog: sog ?? 0, cog: cog ?? 0, heading, navStatus, time, lat: lat ?? 0, lon: lon ?? 0, lastUpdate: Date.now(), stale: false, classB: classB || false };
    const marker = L.marker([v.lat, v.lon], { icon: makeIcon(v.sog, v.cog, v.heading, false, isTracked) });
    marker.bindTooltip(v.name, { permanent: isTracked, direction: 'right', className: 'vessel-label', offset: [10, 0] });
    marker.bindPopup(popupHTML(v), { minWidth: 220, maxWidth: 300 });
    marker.addTo(map);
    v.marker = marker;
    vessels.set(mmsi, v);
  }
}

function removeVesselFromMap(mmsi) {
  const v = vessels.get(mmsi);
  if (v) { map.removeLayer(v.marker); vessels.delete(mmsi); }
}

// ─── Stale check ──────────────────────────────────────────────────────────────
function checkStale() {
  const now = Date.now();
  vessels.forEach((v, mmsi) => {
    const wasStale = v.stale;
    v.stale = (now - v.lastUpdate) > STALE_MS;
    if (v.stale !== wasStale) {
      v.marker.setIcon(makeIcon(v.sog, v.cog, v.heading, v.stale, cfg.mmsiList.includes(mmsi)));
      v.marker.getTooltip().setContent(v.stale ? `${v.name} (stale)` : v.name);
    }
  });
  updateStatusBar();
}

// ─── Geofence ─────────────────────────────────────────────────────────────────
function loadGeofence() {
  const raw = localStorage.getItem(LS.geofence);
  if (!raw) return;
  try {
    const coords  = JSON.parse(raw); // [[lat,lon],...]
    const polygon = L.polygon(coords, { color: '#3388ff', fillOpacity: 0.2, weight: 2 });
    drawnItems.addLayer(polygon);
    geofenceLayer   = polygon;
    geofenceGeoJSON = polygon.toGeoJSON();
    updateZoneStatus();
  } catch { localStorage.removeItem(LS.geofence); }
}

function clearGeofence() {
  drawnItems.clearLayers();
  geofenceLayer   = null;
  geofenceGeoJSON = null;
  localStorage.removeItem(LS.geofence);
  updateZoneStatus();
}

function updateZoneStatus() {
  const el = document.getElementById('zone-status');
  if (geofenceLayer) { el.textContent = 'Zone active ✓'; el.classList.add('active'); }
  else               { el.textContent = 'No zone drawn'; el.classList.remove('active'); }
}

// ─── Alert logic ──────────────────────────────────────────────────────────────
function checkAlert(mmsi) {
  if (!geofenceGeoJSON) return;
  if (!cfg.mmsiList.includes(mmsi)) return;
  const v = vessels.get(mmsi);
  if (!v || v.stale) return;

  const inside = turf.booleanPointInPolygon(turf.point([v.lon, v.lat]), geofenceGeoJSON);
  if (!inside) return;
  if (v.sog > cfg.speedThreshold) return;

  const now         = Date.now();
  const cooldownMs  = cfg.alertCooldown * 60 * 1000;
  if (now - (alertTimes.get(mmsi) || 0) < cooldownMs) return;

  alertTimes.set(mmsi, now);

  const body = `⚠️ ${v.name} (${mmsi}) at ${v.sog.toFixed(1)} kts in alert zone. Pos: ${v.lat.toFixed(4)}, ${v.lon.toFixed(4)}. Time: ${v.time || ''}`;
  sendToServer({ type: 'notify', title: 'Vessel Alert', body });
  pushAlertLog(v.name, v.sog, mmsi);
  flashStatusBar();
}

function pushAlertLog(name, sog, mmsi) {
  alertLog.unshift({ time: new Date().toLocaleTimeString(), text: `${name} (${mmsi}) at ${sog.toFixed(1)} kts` });
  if (alertLog.length > 5) alertLog.pop();
  renderAlertLog();
}

function renderAlertLog() {
  document.getElementById('alert-log').innerHTML =
    alertLog.map(e => `<div class="alert-entry"><time>${esc(e.time)}</time>${esc(e.text)}</div>`).join('');
}

function flashStatusBar() {
  const el = document.getElementById('status-bar');
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1800);
}

// ─── Status bar ───────────────────────────────────────────────────────────────
function setStatus(status, text) {
  const dot   = document.getElementById('status-dot');
  const label = document.getElementById('status-text');
  dot.className = 'status-dot ' + status;
  label.textContent = text || { connected:'Connected to AISStream', reconnecting:'Reconnecting…', disconnected:'Disconnected' }[status] || status;
}

function updateStatusBar() {
  const tracked = cfg.mmsiList.length;
  const active  = [...vessels.values()].filter(v => !v.stale).length;
  const el = document.getElementById('vessel-count');
  if (cfg.trackOnly) {
    el.textContent = `${tracked} vessel${tracked !== 1 ? 's' : ''} tracked, ${active} active`;
  } else {
    el.textContent = `Showing all vessels: ${active} active (${tracked} tracked)`;
  }
}

// ─── WebSocket to relay server ────────────────────────────────────────────────
function sendToServer(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

let wsKeepAliveTimer = null;

function startWSKeepAlive() {
  clearInterval(wsKeepAliveTimer);
  wsKeepAliveTimer = setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'ping' }));
    } else if (!ws || ws.readyState === WebSocket.CLOSED) {
      initWS(); // relay dropped — reconnect immediately
    }
  }, 25_000);
}

function initWS() {
  clearTimeout(wsTimer);
  ws = new WebSocket(`ws://${location.hostname}:3000`);

  ws.onopen = () => {
    sendToServer({ type:'configure', apiKey: cfg.apiKey, mmsiList: cfg.mmsiList, boundingBox: DEFAULT_BBOX });
    setStatus('connected');
    startWSKeepAlive();
  };

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }

    if (msg.type === 'pong') {
      return; // keepalive ack — nothing to do
    } else if (msg.type === 'status') {
      setStatus(msg.status);
    } else if (msg.type === 'error') {
      setStatus('disconnected', `Error: ${msg.message}`);
    } else if (msg.type === 'snapshot') {
      msg.vessels.forEach(v => upsertVessel(v));
      updateStatusBar();
    } else if (msg.MessageType) {
      handleAisMessage(msg);
    }
  };

  ws.onclose = () => {
    clearInterval(wsKeepAliveTimer);
    setStatus('disconnected');
    wsTimer = setTimeout(initWS, 3000);
  };

  ws.onerror = () => {}; // onclose fires after
}

// When the user switches back to this tab, verify the connection is still live.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      clearTimeout(wsTimer);
      initWS();
    }
  }
});

function reconfigure() {
  sendToServer({ type:'reconfigure', apiKey: cfg.apiKey, mmsiList: cfg.mmsiList, boundingBox: DEFAULT_BBOX, trackOnly: cfg.trackOnly });
}

// ─── AIS message handler ──────────────────────────────────────────────────────
function handleAisMessage(msg) {
  const meta = msg.MetaData;
  if (!meta) return;

  const mmsi = String(meta.MMSI);
  const name = (meta.ShipName || '').trim() || mmsi;
  const lat  = meta.latitude;
  const lon  = meta.longitude;
  const time = meta.time_utc;

  switch (msg.MessageType) {
    case 'PositionReport': {
      const pos = msg.Message?.PositionReport;
      if (!pos) return;
      upsertVessel({
        mmsi, name, lat, lon, time,
        sog:       pos.Sog,
        cog:       pos.Cog,
        heading:   pos.TrueHeading,
        navStatus: pos.NavigationalStatus,
        classB:    false,
      });
      break;
    }
    case 'StandardClassBPositionReport': {
      const pos = msg.Message?.StandardClassBPositionReport;
      if (!pos) return;
      upsertVessel({
        mmsi, name, lat, lon, time,
        sog:       pos.Sog,
        cog:       pos.Cog,
        heading:   pos.TrueHeading,
        navStatus: undefined,
        classB:    true,
      });
      break;
    }
    case 'ExtendedClassBPositionReport': {
      const pos = msg.Message?.ExtendedClassBPositionReport;
      if (!pos) return;
      upsertVessel({
        mmsi, name, lat, lon, time,
        sog:       pos.Sog,
        cog:       pos.Cog,
        heading:   pos.TrueHeading,
        navStatus: undefined,
        classB:    true,
      });
      break;
    }
    case 'ShipStaticData': {
      const data = msg.Message?.ShipStaticData;
      if (!data) return;
      upsertVessel({
        mmsi, name, lat, lon, time,
        sog: undefined, cog: undefined, heading: undefined, navStatus: undefined,
        classB: false,
      });
      break;
    }
    case 'StaticDataReport': {
      const data = msg.Message?.StaticDataReport;
      if (!data) return;
      upsertVessel({
        mmsi, name, lat, lon, time,
        sog: undefined, cog: undefined, heading: undefined, navStatus: undefined,
        classB: true,
      });
      break;
    }
    default:
      return;
  }

  checkAlert(mmsi);
  updateStatusBar();
}

// ─── Settings UI ──────────────────────────────────────────────────────────────
function renderMMSIList() {
  const el = document.getElementById('mmsi-list');
  if (cfg.mmsiList.length === 0) {
    el.innerHTML = '<div class="mmsi-empty">No vessels tracked</div>';
    return;
  }
  el.innerHTML = cfg.mmsiList.map(mmsi => {
    const v    = vessels.get(mmsi);
    const name = (v && v.name !== mmsi) ? v.name : '—';
    return `<div class="mmsi-item">
      <div class="mmsi-item-info">
        <span class="mmsi-name">${esc(name)}</span>
        <span class="mmsi-num">${esc(mmsi)}</span>
      </div>
      <button class="mmsi-remove" data-mmsi="${esc(mmsi)}" title="Remove">×</button>
    </div>`;
  }).join('');

  el.querySelectorAll('.mmsi-remove').forEach(btn => {
    btn.addEventListener('click', () => doRemoveMMSI(btn.dataset.mmsi));
  });
}

function doAddMMSI() {
  const input = document.getElementById('mmsi-input');
  const mmsi  = input.value.trim();
  if (!/^\d{9}$/.test(mmsi))              { alert('MMSI must be exactly 9 digits.'); return; }
  if (cfg.mmsiList.includes(mmsi))        { alert('Already tracking this MMSI.'); return; }
  if (cfg.mmsiList.length >= cfg.maxVessels) { alert(`Max vessel count (${cfg.maxVessels}) reached.`); return; }
  cfg.mmsiList.push(mmsi);
  saveSettings();
  renderMMSIList();
  updateStatusBar();
  // Refresh icons for newly tracked vessel
  const v = vessels.get(mmsi);
  if (v) {
    v.marker.setIcon(makeIcon(v.sog, v.cog, v.heading, v.stale, true));
    // Upgrade tooltip to permanent
    v.marker.unbindTooltip();
    v.marker.bindTooltip(v.name, { permanent: true, direction: 'right', className: 'vessel-label', offset: [10, 0] });
  }
  input.value = '';
}

function doRemoveMMSI(mmsi) {
  cfg.mmsiList = cfg.mmsiList.filter(m => m !== mmsi);
  saveSettings();
  if (cfg.trackOnly) {
    removeVesselFromMap(mmsi);
  } else {
    // Downgrade icon and tooltip for untracked vessel
    const v = vessels.get(mmsi);
    if (v) {
      v.marker.setIcon(makeIcon(v.sog, v.cog, v.heading, v.stale, false));
      v.marker.unbindTooltip();
      v.marker.bindTooltip(v.name, { permanent: false, direction: 'right', className: 'vessel-label', offset: [10, 0] });
    }
  }
  renderMMSIList();
  updateStatusBar();
}

function toggleTrackOnly() {
  cfg.trackOnly = !cfg.trackOnly;
  saveSettings();
  updateTrackToggle();
  if (cfg.trackOnly) {
    // Remove non-tracked vessels from the map
    vessels.forEach((v, mmsi) => {
      if (!cfg.mmsiList.includes(mmsi)) removeVesselFromMap(mmsi);
    });
  }
  updateStatusBar();
}

function updateTrackToggle() {
  const btn = document.getElementById('track-toggle');
  if (cfg.trackOnly) {
    btn.textContent = '◎';
    btn.title = 'Tracking: show tracked vessels only';
    btn.classList.remove('active');
  } else {
    btn.textContent = '◉';
    btn.title = 'Tracking: show all vessels in area';
    btn.classList.add('active');
  }
}

function openSettings()  { document.getElementById('settings-panel').classList.add('open'); document.getElementById('settings-overlay').classList.add('open'); map.invalidateSize(); }
function closeSettings() { document.getElementById('settings-panel').classList.remove('open'); document.getElementById('settings-overlay').classList.remove('open'); map.invalidateSize(); }

// ─── Tile layers ──────────────────────────────────────────────────────────────
const TILE_LAYERS = {
  'Standard': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
  }),
  'Dark': L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
    maxZoom: 20,
  }),
  'Light': L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
    maxZoom: 20,
  }),
  'Voyager': L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
    maxZoom: 20,
  }),
  'Topographic': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://opentopomap.org">OpenTopoMap</a>',
    maxZoom: 17,
  }),
};

// ─── Map init ─────────────────────────────────────────────────────────────────
function initMap() {
  // Pick initial layer: saved preference, or match the app theme
  const saved   = localStorage.getItem(LS.mapStyle);
  const themeId = currentTheme();
  const defaultId = saved || (themeId === 'light' ? 'Light' : 'Dark');
  const baseLayer = TILE_LAYERS[defaultId] || TILE_LAYERS['Dark'];

  map = L.map('map').setView(DEFAULT_CENTER, DEFAULT_ZOOM);
  baseLayer.addTo(map);

  L.control.layers(TILE_LAYERS, null, { position: 'topright', collapsed: true }).addTo(map);
  L.control.scale({ position: 'bottomleft', imperial: true, metric: true, maxWidth: 150 }).addTo(map);

  // Persist layer choice on switch
  map.on('baselayerchange', (e) => {
    localStorage.setItem(LS.mapStyle, e.name);
  });

  drawnItems = new L.FeatureGroup().addTo(map);

  const drawControl = new L.Control.Draw({
    position: 'topright',
    draw: {
      polygon:     { shapeOptions: { color: '#3388ff', fillOpacity: 0.2, weight: 2 } },
      polyline:    false,
      rectangle:   false,
      circle:      false,
      marker:      false,
      circlemarker: false,
    },
    edit: { featureGroup: drawnItems, remove: true, edit: false },
  });
  map.addControl(drawControl);

  map.on(L.Draw.Event.CREATED, (e) => {
    if (e.layerType !== 'polygon') return;
    drawnItems.clearLayers();
    drawnItems.addLayer(e.layer);
    geofenceLayer   = e.layer;
    geofenceGeoJSON = e.layer.toGeoJSON();
    const coords = e.layer.getLatLngs()[0].map(ll => [ll.lat, ll.lng]);
    localStorage.setItem(LS.geofence, JSON.stringify(coords));
    updateZoneStatus();
  });

  map.on(L.Draw.Event.DELETED, () => {
    geofenceLayer   = null;
    geofenceGeoJSON = null;
    localStorage.removeItem(LS.geofence);
    updateZoneStatus();
  });

  loadGeofence();
}

// ─── Wire up all UI events ────────────────────────────────────────────────────
function initUI() {
  // Theme
  applyTheme(currentTheme());
  document.getElementById('theme-btn').addEventListener('click', () => applyTheme(currentTheme() === 'dark' ? 'light' : 'dark'));

  // Settings panel
  document.getElementById('settings-btn').addEventListener('click', openSettings);
  document.getElementById('settings-close').addEventListener('click', closeSettings);
  document.getElementById('settings-overlay').addEventListener('click', closeSettings);

  // Track toggle
  updateTrackToggle();
  document.getElementById('track-toggle').addEventListener('click', toggleTrackOnly);

  // API key
  const apiInput = document.getElementById('api-key-input');
  apiInput.value = cfg.apiKey;
  apiInput.addEventListener('change', () => {
    cfg.apiKey = apiInput.value.trim();
    saveSettings();
    reconfigure();
  });

  // Max vessels
  const maxSel = document.getElementById('max-vessels-select');
  maxSel.value = String(cfg.maxVessels);
  maxSel.addEventListener('change', () => { cfg.maxVessels = parseInt(maxSel.value); saveSettings(); });

  // Speed threshold
  const speedIn = document.getElementById('speed-threshold');
  speedIn.value = cfg.speedThreshold;
  speedIn.addEventListener('change', () => {
    const v = parseFloat(speedIn.value);
    if (!isNaN(v) && v >= 0) {
      cfg.speedThreshold = v;
      saveSettings();
      // Refresh all marker colours
      vessels.forEach((vessel, mmsi) => vessel.marker.setIcon(makeIcon(vessel.sog, vessel.cog, vessel.heading, vessel.stale, cfg.mmsiList.includes(mmsi))));
    }
  });

  // Alert cooldown
  const coolIn = document.getElementById('alert-cooldown');
  coolIn.value = cfg.alertCooldown;
  coolIn.addEventListener('change', () => {
    const v = parseInt(coolIn.value);
    if (!isNaN(v) && v >= 1) { cfg.alertCooldown = v; saveSettings(); }
  });

  // MMSI add
  const mmsiInput = document.getElementById('mmsi-input');
  document.getElementById('mmsi-add-btn').addEventListener('click', doAddMMSI);
  mmsiInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doAddMMSI(); });

  // Clear zone
  document.getElementById('clear-zone-btn').addEventListener('click', clearGeofence);

  // Init displays
  renderMMSIList();
  updateZoneStatus();
  updateStatusBar();
}

// ─── Seed settings from server .env (only if not already saved locally) ───────
async function seedFromDefaults() {
  try {
    const res      = await fetch('/api/defaults');
    const defaults = await res.json();
    let changed = false;
    if (!cfg.apiKey && defaults.apiKey) {
      cfg.apiKey = defaults.apiKey;
      changed = true;
    }
    if (cfg.mmsiList.length === 0 && defaults.mmsiList.length > 0) {
      cfg.mmsiList = defaults.mmsiList;
      changed = true;
    }
    if (changed) saveSettings();
  } catch {}
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  await seedFromDefaults(); // populate cfg from .env before UI init
  initMap();
  initUI();
  setStatus('disconnected');
  initWS();
  setInterval(checkStale, 60_000);
});
</script>
