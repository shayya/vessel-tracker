<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vessel Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- Prevent theme flash before DOMContentLoaded -->
<script>
(function(){
  var t = localStorage.getItem('ais_theme');
  var html = document.documentElement;
  if (t === 'light' || t === 'dark') { html.setAttribute('data-theme', t); }
  else { html.setAttribute('data-theme', window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); }
})();
</script>

<!-- ─── Header ────────────────────────────────────────────────── -->
<header id="header">
  <span class="app-title">Vessel Tracker</span>
  <div class="header-right">
    <div id="status-dot" class="status-dot disconnected" title="Connection status"></div>
    <button id="track-toggle" class="icon-btn" title="Toggle tracked / all vessels">◎</button>
    <button id="theme-btn"    class="icon-btn" title="Toggle theme">☀</button>
    <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
  </div>
</header>

<!-- ─── Settings ─────────────────────────────────────────────── -->
<div id="settings-overlay"></div>
<aside id="settings-panel">
  <div class="settings-header">
    <h2>Settings</h2>
    <button id="settings-close" class="icon-btn" style="font-size:18px;">×</button>
  </div>

  <div class="settings-section">
    <h3>AISStream API Key</h3>
    <input type="password" id="api-key-input" placeholder="Paste your API key…" autocomplete="off">
  </div>

  <div class="settings-section">
    <h3>Tracked Vessels</h3>
    <div class="input-row">
      <input type="text" id="mmsi-input" placeholder="9-digit MMSI…" maxlength="9" inputmode="numeric">
      <button id="mmsi-add-btn" class="btn-primary">Add</button>
    </div>
    <div class="inline-row">
      <label>Max vessels:</label>
      <select id="max-vessels-select">
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5" selected>5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
      </select>
    </div>
    <div id="mmsi-list"></div>
  </div>

  <div class="settings-section">
    <h3>Alert Settings</h3>
    <div class="form-group">
      <label>Speed Threshold (kts)</label>
      <input type="number" id="speed-threshold" value="2.0" min="0" max="50" step="0.1">
    </div>
    <div class="form-group">
      <label>Alert Cooldown (min)</label>
      <input type="number" id="alert-cooldown" value="30" min="1" max="1440">
    </div>
  </div>

  <div class="settings-section">
    <h3>Geofence</h3>
    <div class="zone-row">
      <div id="zone-status" class="zone-status">No zone drawn</div>
      <button id="toggle-zone-vis" class="btn-icon" title="Toggle visibility" disabled>👁</button>
    </div>
    <button id="clear-zone-btn" class="btn-danger">Clear Zone</button>
  </div>
</aside>

<!-- ─── Map ───────────────────────────────────────────────────── -->
<div id="map"></div>

<!-- ─── Status bar ───────────────────────────────────────────── -->
<footer id="status-bar">
  <div class="status-meta">
    <span id="status-text">Connecting…</span>
    <span id="vessel-count">0 vessels tracked</span>
  </div>
  <div id="alert-log"></div>
</footer>

<!-- ─── CDN Scripts ───────────────────────────────────────────── -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<script type="module" src="app.js"></script>
</body>
</html>
