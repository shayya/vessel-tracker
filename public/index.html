<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vessel Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- Prevent theme flash before DOMContentLoaded -->
<script>
(function(){
  var t = localStorage.getItem('ais_theme');
  var html = document.documentElement;
  if (t === 'light' || t === 'dark') { html.setAttribute('data-theme', t); }
  else { html.setAttribute('data-theme', window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); }
})();
</script>

<!-- ─── Settings ─────────────────────────────────────────────── -->
<div id="settings-overlay"></div>
<aside id="settings-panel">
  <div class="settings-header">
    <h2>Settings</h2>
    <button id="settings-close" class="icon-btn" style="font-size:18px;">×</button>
  </div>

  <div class="settings-section">
    <h3>AISStream API Key</h3>
    <input type="password" id="api-key-input" placeholder="Paste your API key…" autocomplete="off">
  </div>

  <div class="settings-section">
    <h3>Alert Settings</h3>
    <div class="form-group">
      <label>Speed Threshold (kts)</label>
      <input type="number" id="speed-threshold" value="2.0" min="0" max="50" step="0.1">
    </div>
    <div class="form-group">
      <label>Alert Cooldown (min)</label>
      <input type="number" id="alert-cooldown" value="30" min="1" max="1440">
    </div>
  </div>

  <div class="settings-section">
    <h3>Geofence</h3>
    <div class="zone-row">
      <div id="zone-status" class="zone-status">No zone drawn</div>
      <button id="toggle-zone-vis" class="btn-icon" title="Toggle visibility" disabled>👁</button>
    </div>
    <button id="clear-zone-btn" class="btn-danger">Clear Zone</button>
  </div>

  <div class="settings-section">
    <h3>Recent Alerts</h3>
    <div id="alert-log"></div>
  </div>
</aside>

<!-- ─── Sidebar ──────────────────────────────────────────────── -->
<aside id="sidebar">
  <div class="sidebar-buttons">
    <button id="sidebar-maptype"  class="sidebar-btn" title="Map type">🗺</button>
    <button id="sidebar-fleets"   class="sidebar-btn" title="Tracked vessels">❤</button>
    <button id="sidebar-anchor"   class="sidebar-btn" title="Marine chart toggle">⚓</button>
    <button id="sidebar-draw"     class="sidebar-btn" title="Draw geofence">✏</button>
    <button id="sidebar-theme"    class="sidebar-btn" title="Toggle theme">☀</button>
    <button id="sidebar-settings" class="sidebar-btn" title="Settings">⚙</button>
  </div>
  <div class="sidebar-status">
    <span id="status-dot" class="status-dot disconnected"></span>
    <span id="sidebar-count">● 0</span>
    <span id="sidebar-active">0 live</span>
  </div>
</aside>

<!-- ─── Sidebar popups ───────────────────────────────────────── -->
<div class="sidebar-popup" id="popup-maptype">
  <div class="popup-title">Map Type</div>
  <label class="popup-radio"><input type="radio" name="mapstyle" value="Light"> Light</label>
  <label class="popup-radio"><input type="radio" name="mapstyle" value="Dark"> Dark</label>
  <label class="popup-radio"><input type="radio" name="mapstyle" value="Satellite"> Satellite</label>
  <label class="popup-check"><input type="checkbox" id="seamarks-check"> Nautical chart</label>
</div>

<div class="sidebar-popup" id="popup-fleets">
  <div class="popup-title">Tracked Vessels</div>
  <div class="popup-toggle-row">
    <label class="popup-check"><input type="checkbox" id="show-all-vessels"> Show other vessels</label>
  </div>
  <div class="popup-add-row">
    <input type="text" id="mmsi-input" placeholder="9-digit MMSI…" maxlength="9" inputmode="numeric">
    <button id="mmsi-add-btn" class="btn-primary">Add</button>
  </div>
  <div id="mmsi-list" class="popup-mmsi-list"></div>
</div>

<!-- ─── Map ───────────────────────────────────────────────────── -->
<div id="map"></div>

<!-- ─── CDN Scripts ───────────────────────────────────────────── -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<script type="module" src="app.js"></script>
</body>
</html>
